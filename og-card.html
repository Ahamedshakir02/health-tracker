<!doctype html>
<!--
  Source for public/og.png. Not part of the build — it is served by the dev
  server, screenshotted at exactly 1200×630, and then deleted. Kept in git so
  the card can be regenerated rather than reverse-engineered from a PNG.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="module">
      import '@fontsource-variable/hanken-grotesk';
      import '@fontsource-variable/newsreader';
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { background: #888; }
      .card {
        position: absolute;
        top: 0;
        left: 0;
        width: 1200px;
        height: 630px;
        padding: 76px 80px;
        background: #f4f3f0;
        color: #1c1b19;
        font-family: 'Hanken Grotesk Variable', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .mark {
        width: 64px; height: 64px; border-radius: 18px;
        background: #2a78d6; color: #fff;
        display: grid; place-items: center;
      }
      .mark svg { width: 38px; height: 38px; }
      .name { font-size: 30px; font-weight: 650; letter-spacing: -0.01em; }
      .sub {
        font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #8a857c;
      }
      h1 {
        margin-top: auto;
        font-family: 'Newsreader Variable', Georgia, serif;
        font-weight: 500;
        font-size: 78px;
        line-height: 1.02;
        letter-spacing: -0.025em;
        max-width: 17ch;
      }
      p.lede {
        margin-top: 22px;
        font-size: 27px;
        line-height: 1.4;
        color: #57544e;
        max-width: 34ch;
      }
      .rule {
        margin-top: 40px;
        display: flex;
        gap: 10px;
      }
      .rule span { height: 7px; border-radius: 4px; }
      .r1 { width: 150px; background: #eb6834; }
      .r2 { width: 80px; background: #2a78d6; }
      .r3 { width: 50px; background: #1baf7a; }
      .r4 { width: 30px; background: #c98a00; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <span class="mark">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21c-1-.7-8-5.4-8-11a4.5 4.5 0 0 1 8-2.9A4.5 4.5 0 0 1 20 10c0 5.6-7 10.3-8 11z" />
          </svg>
        </span>
        <span>
          <div class="name">Vitals</div>
          <div class="sub">Health Tracker</div>
        </span>
      </div>

      <h1>A health tracker you actually own.</h1>
      <p class="lede">Weight, food, training and habits — with every lift demonstrated.</p>

      <div class="rule">
        <span class="r1"></span><span class="r2"></span><span class="r3"></span><span class="r4"></span>
      </div>
    </div>
  </body>
</html>
