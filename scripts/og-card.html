<!doctype html>
<!--
  Source for public/og.png. Not part of the build and not a Vite entry — it is
  served by the dev server at /scripts/og-card.html, screenshotted at exactly
  1200×630, and the screenshot saved over public/og.png. Kept in git so the
  card can be regenerated rather than reverse-engineered from a PNG.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="module">
      import '@fontsource/baloo-chettan-2/latin-700.css';
      import '@fontsource/noto-sans/latin-400.css';
      import '@fontsource/noto-sans/latin-600.css';
      import '@fontsource/noto-sans-mono/latin-500.css';
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { background: #888; }
      .card {
        position: absolute;
        top: 0;
        left: 0;
        width: 1200px;
        height: 630px;
        padding: 76px 80px;
        background: #fbf8f1;
        color: #2b2a24;
        font-family: 'Noto Sans', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .mark {
        width: 64px; height: 64px; border-radius: 999px;
        background: #1e4d2b; color: #f4a52a;
        display: grid; place-items: center;
      }
      .mark svg { width: 44px; height: 44px; }
      .name { font-family: 'Baloo Chettan 2', system-ui, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.01em; }
      .sub {
        font-family: 'Noto Sans Mono', monospace;
        font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #6e6b60;
      }
      h1 {
        margin-top: auto;
        font-family: 'Baloo Chettan 2', system-ui, sans-serif;
        font-weight: 700;
        font-size: 76px;
        line-height: 1.03;
        letter-spacing: -0.02em;
        max-width: 17ch;
      }
      p.lede {
        margin-top: 22px;
        font-size: 27px;
        line-height: 1.4;
        color: #4a4840;
        max-width: 34ch;
      }
      .rule {
        margin-top: 40px;
        display: flex;
        gap: 10px;
      }
      .rule span { height: 7px; border-radius: 4px; }
      .r1 { width: 150px; background: #1e4d2b; }
      .r2 { width: 80px; background: #f4a52a; }
      .r3 { width: 50px; background: #15786b; }
      .r4 { width: 30px; background: #2a5f8f; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <span class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12.9h4.4l1.7-3.1 3.5 9.2 4.3-14 1.8 7.9H22" />
          </svg>
        </span>
        <span>
          <div class="name">Vitals</div>
          <div class="sub">Health Tracker</div>
        </span>
      </div>

      <h1>A health tracker you actually own.</h1>
      <p class="lede">Weight, food, training and habits — with every lift demonstrated.</p>

      <div class="rule">
        <span class="r1"></span><span class="r2"></span><span class="r3"></span><span class="r4"></span>
      </div>
    </div>
  </body>
</html>
