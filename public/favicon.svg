<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vitals">
  <!-- The app's brand mark: a saffron heart on the forest-green plate, with a
       heartbeat trace cut through it so it reads as "vitals", not just "love".
       The trace is a mask, so the plate shows through it. Same geometry as
       IconHeart in src/components/icons.tsx and scripts/build-icons.mjs. -->
  <defs>
    <mask id="pulse">
      <rect width="64" height="64" fill="#fff" />
      <path
        d="M17.6 28.7H21.9L25.6 21.6 30.4 36.7 35.7 19.5 39.7 28.7H46.4"
        fill="none"
        stroke="#000"
        stroke-width="4.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="#1e4d2b" />
  <path
    d="M32 51.2c-2.67-1.87-21.33-14.4-21.33-29.33A12 12 0 0 1 32 14.4a12 12 0 0 1 21.33 7.47C53.33 36.8 34.67 49.33 32 51.2z"
    fill="#f4a52a"
    mask="url(#pulse)"
  />
</svg>
