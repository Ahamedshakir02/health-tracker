<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vitals">
  <!-- The app's brand mark: a heartbeat trace whose deep dip and tall spike
       form the V of Vitals, struck in saffron on the forest-green plate it sits
       on in the rail. A rounded square rather than a bare glyph, so it reads at
       16px in a tab strip. scripts/build-icons.mjs draws the same points. -->
  <rect width="64" height="64" rx="15" fill="#1e4d2b" />
  <polyline
    points="9,33 19,33 23,26 31,47 41,15 45,33 55,33"
    fill="none"
    stroke="#f4a52a"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
